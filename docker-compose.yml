services:
  app:
    container_name: drop-archiving
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_URL: ${MINIO_URL}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_BUCKET: ${MINIO_BUCKET}
      GRPC_URL: ${GRPC_URL}
    depends_on:
      - db
      - minio
    networks:
      - drop-shared

  db: 
    container_name: postgres-archiving
    image: postgres:16.4-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - drop-shared
      
  minio:
    container_name: minio-archiving
    image: minio/minio
    command: server --console-address ":8091" --address ":9001" /data
    ports:
      - "9002:9001"
      - "8091:8091"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - drop-shared

volumes:
  db_data:
  minio_data:

networks:
  drop-shared:
    external: true
